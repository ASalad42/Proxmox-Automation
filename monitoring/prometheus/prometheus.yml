global:
  scrape_interval:     15s 
scrape_configs:
  - job_name: 'pve'
    static_configs:
      - targets:
        - ip:8006  # Proxmox VE node.
    metrics_path: /pve
    params:
      module: [default]
      node: ['pve']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: ip:9221 # PVE exporter (pointing to docker container running pve exporter)

        
  - job_name: 'prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node_exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']